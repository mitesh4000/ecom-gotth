services:
  app:
    build:
      context: .
      args:
        TEMPL_VERSION: v0.2.793
        TAILWIND_VERSION: v4.3.5
    image: pushti-sangar:stage1
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      ENV: production
      PORT: "5000"
      DATABASE_URL: /data/app.db
      UPLOADS_DIR: /uploads
      TMPDIR: /data/tmp
    volumes:
      - app_data:/data
      - app_uploads:/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  app_data:
  app_uploads:
